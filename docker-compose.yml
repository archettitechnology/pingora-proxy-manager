services:
  pingora-proxy:
    build: .
    image: pingora-proxy-manager:latest
    container_name: pingora-proxy
    restart: always
    ports:
      - "80:8080"   # HTTP Proxy (Backend listens on 8080)
      - "81:81"     # Dashboard/API (Backend listens on 81)
      # HTTPS Port 443 is mapped to 443 on host, backend should listen on 443 inside if privileged, 
      # or we map 443->8443 if backend uses unprivileged port. 
      # For now, assuming backend binds to 443 or uses NAT. 
      # Let's map 443 -> 443 but backend needs to bind it.
      # If backend binds 8080 for HTTP, usually it binds 8443 for HTTPS.
      # Let's stick to 80->8080 and 81->81 for now as per main.rs logic.
    volumes:
      - ./data:/app/data        # DB and Certs persistence (for SQLite)
      - ./logs:/app/logs        # Logs persistence
    environment:
      - JWT_SECRET=changeme_in_production_please
      - RUST_LOG=info
      # Database configuration
      # For SQLite (default):
      - DATABASE_TYPE=sqlite
      - DATABASE_URL=sqlite:data/data.db?mode=rwc
      # For MySQL/MariaDB (uncomment and configure):
      # - DATABASE_TYPE=mysql
      # - MYSQL_HOST=mysql
      # - MYSQL_PORT=3306
      # - MYSQL_USER=pingora
      # - MYSQL_PASSWORD=pingora_password
      # - MYSQL_DATABASE=pingora_proxy
      # Or use a full connection string:
      # - DATABASE_URL=mysql://pingora:pingora_password@mysql:3306/pingora_proxy
    # depends_on:
    #   - mysql  # Uncomment if using MySQL

  # MySQL/MariaDB service (optional)
  # Uncomment this section to use MySQL/MariaDB instead of SQLite
  # mysql:
  #   image: mariadb:latest
  #   container_name: pingora-mysql
  #   restart: always
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=root_password
  #     - MYSQL_DATABASE=pingora_proxy
  #     - MYSQL_USER=pingora
  #     - MYSQL_PASSWORD=pingora_password
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   ports:
  #     - "3306:3306"  # Expose MySQL port (optional, for external access)

# volumes:
#   mysql-data:  # Uncomment if using MySQL